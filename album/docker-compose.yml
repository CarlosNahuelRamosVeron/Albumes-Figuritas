services:
  db:
    image: mysql:8.0
    container_name: album_mysql
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: albumdb
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    container_name: album_app
    profiles: ["mysql"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/albumdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  app-h2:
    build: .
    container_name: album_app_h2
    profiles: ["h2"]
    environment:
      SPRING_PROFILES_ACTIVE: h2
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

volumes:
  db_data:
  uploads_data:
